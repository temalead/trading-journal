spring.application.name=trading-journal-core
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_journal
spring.datasource.username=trading
spring.datasource.password=trading
spring.datasource.driver-class-name=org.postgresql.Driver
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

storage.s3.endpoint=http://localhost:9000
storage.s3.public-base-url=http://localhost:9000
storage.s3.access-key=trading
storage.s3.secret-key=trading-secret
storage.s3.bucket=trading-journal-images
