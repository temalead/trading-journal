services:
  postgres:
    image: postgres:17-alpine
    container_name: trading-journal-postgres
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: trading-journal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trading
      MINIO_ROOT_PASSWORD: trading-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 trading trading-secret; do sleep 1; done;
      mc mb --ignore-existing local/trading-journal-images;
      mc anonymous set download local/trading-journal-images;
      "

volumes:
  postgres-data:
  minio-data:
